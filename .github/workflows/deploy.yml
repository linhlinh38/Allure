name: Deploy to Production

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push app Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: minhpham11311/allure-app:latest

      - name: Build and push migrations Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.migrations
          push: true
          tags: minhpham11311/allure-migrations:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy deployment files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.*.yml,deploy.sh,advance.deploy.sh,Dockerfile,Dockerfile.migrations"
          target: "~/allure-app"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/allure-app
            chmod +x deploy.sh
            chmod +x advance.deploy.sh

            # Create .env file from secrets
            cat > .env << EOF
            NODE_ENV=production
            PORT=${{ secrets.PORT }}
            TZ=Asia/Ho_Chi_Minh

            # Database
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_NAME=${{ secrets.DB_NAME }}

            # Redis
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}

            # JWT
            SECRET_KEY_FOR_ACCESS_TOKEN=${{ secrets.SECRET_KEY_FOR_ACCESS_TOKEN }}
            SECRET_KEY_FOR_REFRESH_TOKEN=${{ secrets.SECRET_KEY_FOR_REFRESH_TOKEN }}

            # Google Login
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            REDIRECT_URI=${{ secrets.REDIRECT_URI }}

            # Email
            EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            FROM_EMAIL=${{ secrets.FROM_EMAIL }}

            # Firebase
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_PRIVATE_KEY_ID=${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
            FIREBASE_PRIVATE_KEY='${{ secrets.FIREBASE_PRIVATE_KEY }}'
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_CLIENT_ID=${{ secrets.FIREBASE_CLIENT_ID }}
            FIREBASE_AUTH_URI=${{ secrets.FIREBASE_AUTH_URI }}
            FIREBASE_TOKEN_URI=${{ secrets.FIREBASE_TOKEN_URI }}
            FIREBASE_AUTH_PROVIDER_X509_CERT_URL=${{ secrets.FIREBASE_AUTH_PROVIDER_X509_CERT_URL }}
            FIREBASE_CLIENT_X509_CERT_URL=${{ secrets.FIREBASE_CLIENT_X509_CERT_URL }}

            # Payos
            PAYOS_CLIENT_ID=${{ secrets.PAYOS_CLIENT_ID }}
            PAYOS_API_KEY=${{ secrets.PAYOS_API_KEY }}
            PAYOS_CHECKSUM_KEY=${{ secrets.PAYOS_CHECKSUM_KEY }}
            PAYOS_RETURN_URL=${{ secrets.PAYOS_RETURN_URL }}
            PAYOS_CANCEL_URL=${{ secrets.PAYOS_CANCEL_URL }}

            # Agora
            AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}
            AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}

            # Migration settings
            GENERATE_MIGRATIONS=true
            MIGRATION_NAME=update_$(date +%Y%m%d%H%M%S)
            EOF

            # Use the advanced deployment script for safer updates
            ./advance.deploy.sh
